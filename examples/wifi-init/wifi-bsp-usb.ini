# riscv/esp32c3db with the WiFi IRAM region AND the USB-Serial-JTAG console.
#
# Same as wifi-bsp.ini except for the console.  A board with a USB-to-UART
# bridge chip wants ESPRESSIF_USE_USB_CONSOLE = False, which is the other
# config; a board whose USB goes straight to the C3 -- no bridge IC, which is
# how most small-vendor C3 boards are built -- wants True, and with the wrong
# one it boots perfectly and prints nothing at all.
#
# That failure looks exactly like a dead board, which is why both variants are
# built rather than one being chosen on a guess.
[riscv/esp32c3db]
BUILD_TESTS = False
ESPRESSIF_USE_USB_CONSOLE = True
ESP32C_IRAM_REGION_SIZE = 0xC000
