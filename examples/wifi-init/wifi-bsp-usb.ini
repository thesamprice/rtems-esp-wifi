# riscv/esp32c3db with the WiFi IRAM region AND the USB-Serial-JTAG console.
#
# Same as wifi-bsp.ini except for the console.  A board with a USB-to-UART
# bridge chip wants ESPRESSIF_USE_USB_CONSOLE = False, which is the other
# config; a board whose USB goes straight to the C3 -- no bridge IC, which is
# how most small-vendor C3 boards are built -- wants True, and with the wrong
# one it boots perfectly and prints nothing at all.
#
# That failure looks exactly like a dead board, which is why both variants are
# built rather than one being chosen on a guess.
[riscv/esp32c3db]
BUILD_TESTS = False
ESPRESSIF_USE_USB_CONSOLE = True
ESP32C_IRAM_REGION_SIZE = 0xC000

# 1.5 MiB of code rather than the default 1 MiB.
#
# examples/wifi-net fits in the default with about 70 KiB to spare; the
# MicroPython example does not, and overflows CODE_FLASH_RAW by roughly 290 KiB
# once the interpreter is linked beside the WiFi blobs, lwIP and mbedtls.
#
# The room is simply there: the part has 4 MiB of flash and this is a
# direct-boot image with nothing reserved after it -- no bootloader, no
# partition table, no OTA slot.  #103 is about that layout being a cheat, and
# this takes a little more of what that cheat already assumes.
ESP32C_CODE_REGION_SIZE = 0x180000
