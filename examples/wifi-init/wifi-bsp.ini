# riscv/esp32c3db with an IRAM region large enough for the WiFi libraries.
#
# 0xC000 = 48 KiB.  Measured demand is 44.0 KiB of .wifi*iram and .iram1
# sections from the blobs (see the glue repo's docs/step4.md), so this is that
# plus a little headroom.  config_esp32c3db_iram.ini stays at 0x2000, which is
# what tests/bsp-iram needs to prove the mechanism; paying 48 KiB of heap for a
# configuration with no WiFi in it would be wrong.
[riscv/esp32c3db]
BUILD_TESTS = False
ESPRESSIF_USE_USB_CONSOLE = False
ESP32C_IRAM_REGION_SIZE = 0xC000
